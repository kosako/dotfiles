# paths: declares the managed FILES of a module (home-relative, literal,
# one line per file). .chezmoiignore is an allowlist (#207): everything is
# ignored except the declared paths of active modules, and the ancestor
# directories of a declared path are un-ignored automatically as
# pass-through — so directories are not declared here, and declaring a
# directory never admits its other children.
modules:
  base:
    description: 全環境共通の最小設定。
  git-profile:
    description: directory convention に基づく Git identity 分離。非 personal context は managed な identity reset(~/.config/git-profile/identity-reset.gitconfig、値なし)を context file の直前に include し、personal の remote fallback が context をまたいで流入しない(#202)。
    paths:
      - .gitconfig
      - .config/git-profile/identity-reset.gitconfig
  git-ignore:
    description: AI agent の local-only file を global gitignore で全 repo から除外する(#248・agent-tools#253 の packet 規約)。managed file は git 既定の global excludes(~/.config/git/ignore。core.excludesFile 未設定のときだけ読まれる)で、agent packet `.agent-packets/` と Claude Code の project local settings `**/.claude/settings.local.json` を持つ。repo ごとの .gitignore は fail-safe で、第一防衛はこの global(忘れた repo の `git add -A` で private な packet が乗らない)。managed な ~/.gitconfig は core.excludesFile を pin しない(明示値は host 自身の excludesFile を黙って上書きするため)。git は global excludes を 1 file しか読まないので .local は無く、host 固有の除外は各 repo の .git/info/exclude に置く。work は非列挙(agent-tools の packet を書く運用が無く、会社 Mac の既存 global ignore を diff 無しで置換しないため。採用するなら preflight で既存 file を確認してから module を列挙する)。
    paths:
      - .config/git/ignore
  supply-chain-git:
    description: Git credential 漏洩防止と remote URL 検査。
  supply-chain-npm:
    description: npm hardening の report / enforce。
    paths:
      - .npmrc
    requires:
      npmHardeningMode: enforce
  supply-chain-corepack:
    description: Corepack availability と packageManager policy。
  doctor:
    description: 導入後の健康診断。
  preflight:
    description: 導入前の危険検知。
  runtime:
    description: mise による runtime 管理。
    paths:
      - .config/mise/config.toml
    requires:
      enableRuntimeManagement: true
  shell-extra:
    description: zsh shell 設定(explicit-first、starship + 個別プラグイン、local override 対応)。
    paths:
      - .zshenv
      - .zshrc
      - .zprofile
      - .config/starship.toml
  ssh-1password:
    description: 1Password SSH Agent 用の SSH 設定。秘密鍵は管理しない。
    paths:
      - .ssh/config
  direnv-policy:
    description: direnv 利用方針。direnv allow は自動化しない。
  update-policy:
    description: 自動 upgrade を避ける更新方針。
  gui-apps:
    description: opt-in の GUI app install。
  git-signing:
    description: commit / tag の SSH 署名(1Password op-ssh-sign)。仕組みのみ managed、鍵と opt-in は context 別 local。
    paths:
      - .config/git/signing.gitconfig
    requires:
      enableGitSigning: true
  ai-policy:
    description: AI agent 権限方針。
  claude-settings:
    description: Claude Code harness 設定。personal の public-safe な settings.json のみ管理(settings.local.json は管理しない)。hooks 登録は 3 capability が同じ hooks object(.chezmoitemplates/agent-hooks-json、Codex と共有)に出す — enableGitHubIsolatedReader(PreToolUse safe-gh 誘導・#137)、enableQualityLoopHooks(PostToolUse fast-edit-check + Stop changed-scope-qa・#199)、enableHerdrIntegration(SessionStart herdr-agent-state.sh・#225)。registration=dotfiles / body=agent-tools(herdr hook の body は herdr の installer)。
    paths:
      - .claude/settings.json
  opencode-settings:
    description: OpenCode harness 設定(#234)。managed な ~/.config/opencode/opencode.json に permission の床(secret floor の read / bash deny・外向き / 昇格 bash は ask・他は allow)、autoupdate off(update-policy)、share disabled、instructions(agent-tools 配布の運用ルール。OpenCode は @ import を解釈しないので明示)を置く。provider / model / auth / plugin / TUI の好みは書かない(local は OPENCODE_CONFIG が指す file で merge 上書き)。skill は ~/.claude/skills を OpenCode が直接読むので配布不要。plugin による hook parity と相互レビュー契約への追加は OpenCode 導入 Phase 2(agent-tools#295)。
    paths:
      - .config/opencode/opencode.json
  git-hook-gates:
    description: commit 境界の git hook gates 配線(#196)。~/.config/git-hook-gates/hooks に薄い shim(pre-commit / commit-msg)を置き、agent-tools 配備の personal-git-hook-dispatcher へ exec で委譲する(実体=agent-tools・配線=dotfiles。契約の正本は agent-tools の docs/git-hook-gates.md)。global core.hooksPath は dot_gitconfig の無条件 include が読む hooks.gitconfig(この module の managed file)で設定する(missing なら git が無視=signing.gitconfig と同型)。render は 2 段 gate — enableGitHookGates(intent)AND destination に agent-tools 配備 4 本(dispatcher + public-safety / git-identity / ai-trailer gate。identity gate は agent-tools#281・#239 で追随)が完全に存在(readiness、.chezmoitemplates/git-hook-gates-armed)— の両立時のみ。dispatcher は gate 欠損時 fail-closed なので、未配備・部分配備のマシンでは武装せず素通りする(新規マシンの apply で commit を brick しない。PR #197 Codex must)。cap gate は module の requires ではなく template 自己 gate(鍵が欠けると空 render → chezmoi が既存 target も削除。requires だと chezmoiignore が既存 file を prune せず、fail-closed な shim が残置される)。置き場を ~/.config/git 配下にしなかったのは #207 以前の経緯 — 当時の denylist では git-signing module が ~/.config/git を dir ごと宣言し、enableGitSigning=false の profile で subtree ごと落ちて gate が黙って消えたため(当時の実測)。現行の allowlist では祖先 dir は活性 module の宣言 path から union されるのでこの制約は無いが、配置は経緯どおり維持する(dotfiles 側の docs/git-hook-gates.md「置き場所が ~/.config/git/ 配下でない理由」)。
    paths:
      - .config/git-hook-gates/hooks.gitconfig
      - .config/git-hook-gates/hooks/pre-commit
      - .config/git-hook-gates/hooks/commit-msg
  codex-settings:
    description: Codex CLI harness 設定。user 層 ~/.codex/hooks.json に safe-gh 誘導の PreToolUse hook(#181・#137 の Codex parity・gate=enableGitHubIsolatedReader)、品質ループの PostToolUse fast-edit-check + Stop changed-scope-qa(#199・gate=enableQualityLoopHooks)、herdr integration の SessionStart hook(#225・gate=enableHerdrIntegration・body は herdr の installer)を登録し(hooks object は .chezmoitemplates/agent-hooks-json で Claude と共有)、~/.codex/rules/default.rules に承認 rules の read-only baseline を配る(#139・gate=enableAiPolicy。堆積 grant を drift 可視化し apply で棚卸し)。registration=dotfiles / body=agent-tools(safe-gh・品質ループ)または herdr(herdr integration)。config.toml は codex 所有の live ファイルなので管理しない(projects trust は doctor が report-only 監視)。cap gate はすべて module の requires ではなく template 自己 gate で行う(hooks.json は 3 つの hook cap が全部 false で空 render → chezmoi が既存 target も削除)。requires を使うと chezmoiignore が既存 file を prune せず残置するため(Codex review #184)。
    paths:
      - .codex/hooks.json
      - .codex/rules/default.rules
