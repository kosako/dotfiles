profiles:
  personal:
    environmentKind: personal
    modules:
      - base
      - git-profile
      - supply-chain-git
      - supply-chain-npm
      - supply-chain-corepack
      - doctor
      - preflight
      - runtime
      - shell-extra
      - ssh-1password
      - direnv-policy
      - gui-apps
      - update-policy
      - ai-policy
      - claude-settings
      - codex-settings
      - git-signing
    capabilities:
      installPackages: true
      installGuiApps: true
      enable1PasswordSSH: true
      enableGitSigning: true
      enableDirenv: true
      enableRuntimeManagement: true
      npmHardeningMode: enforce
      corepackMode: report
      allowNetworkTunnels: true
      allowSecretsAccess: true
      enableAiTools: false
      enforceAiSandbox: false
      # #73: opt in to the report-only monitoring layer. doctor runs
      # agent-tools' status.sh (--json, read-only, contract v2) and summarizes
      # its health (clean / checks / stale / sync conflicts) as warnings. Still
      # report-only / exit 0; never clones / pulls / syncs. A non-standard
      # checkout path is resolved via AGENT_TOOLS in the local, non-tracked
      # ~/.zshrc.local (the concrete path is never baked into tracked files; see
      # docs/local-overrides.md).
      enableAgentToolsStatus: true
      # #139: beyond the policy docs + report-only checks, this now drives the
      # managed Codex approval-rules baseline (~/.codex/rules/default.rules via
      # codex-settings, template self-gated): a read-only allowlist so outward /
      # escalation actions stay behind per-invocation approval. Accumulated
      # grants surface as drift and `chezmoi apply` resets them (棚卸し). The
      # other accumulation channel — [projects] trust in codex-owned
      # config.toml — cannot be managed (#181) and is watched by doctor only.
      enableAiPolicy: true
      # Phase 2 (#119): deny the github MCP server in the managed settings.json.
      # Best-effort / steering (not an enforcement boundary; see
      # docs/ai-environment-boundary.md). No github MCP is configured today, so
      # this is harmless defense-in-depth: an MCP added later is pre-denied.
      gateGitHubMcp: true
      # #137 / #181: register the PreToolUse hook (personal-safe-gh-hook) so raw
      # `gh` reads of untrusted GitHub content are steered to the safe-gh isolated
      # reader. ONE capability drives BOTH AI homes: claude-settings emits it into
      # the managed ~/.claude/settings.json (#137) and codex-settings emits it into
      # the user-layer ~/.codex/hooks.json (#181, Codex parity). Steering / fail-
      # open (missing body, non-2 exit, bad JSON all continue the tool call) — NOT
      # an enforcement boundary. Codex adds an extra inert stage: even a registered
      # hook is silently skipped until a one-time `/hooks` trust. Hook/reader bodies
      # are deployed by agent-tools (registration=dotfiles, body=agent-tools;
      # docs/config-ownership.md, agent-tools#146).
      enableGitHubIsolatedReader: true

  work:
    environmentKind: work
    modules:
      - base
      - git-profile
      - runtime
      - shell-extra
      - supply-chain-git
      - supply-chain-npm
      - supply-chain-corepack
      - doctor
      - preflight
      - direnv-policy
      - update-policy
      - ai-policy
    capabilities:
      installPackages: false
      installGuiApps: false
      enable1PasswordSSH: false
      enableGitSigning: false
      enableDirenv: true
      enableRuntimeManagement: true
      npmHardeningMode: report
      corepackMode: report
      allowNetworkTunnels: false
      allowSecretsAccess: false
      enableAiTools: false
      enforceAiSandbox: false
      enableAgentToolsStatus: false
      enableAiPolicy: true
      gateGitHubMcp: false
      enableGitHubIsolatedReader: false
