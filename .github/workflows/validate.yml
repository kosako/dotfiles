name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  YQ_VERSION: 4.54.1
  YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
  AGE_VERSION: 1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  # chezmoi and codex for the render job (Linux) and the bash32 job's render
  # group (macOS arm64): one version each, a checksum per platform.
  CHEZMOI_VERSION: 2.73.0
  CHEZMOI_SHA256: b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa
  CODEX_VERSION: 0.162.1
  CODEX_SHA256: 86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057
  # The same versions for the macOS (arm64) runner of the bash32 job.
  YQ_SHA256_DARWIN_ARM64: fee511a181bd8b3e6b7da98842b41973bfac8cd3bcd341ed29a584620b5b2844
  AGE_SHA256_DARWIN_ARM64: e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5
  CHEZMOI_SHA256_DARWIN_ARM64: 246679a0b200e7e8be4a951be3b95d37c33ecb87eaab5af6f4949f7d0317bcc1
  CODEX_SHA256_DARWIN_ARM64: b293a0fcdd871900a44c0a4f40a1aa401b31e02854f790ebdb8bd5d1177fd1fe

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The policy scripts require mikefarah/yq v4. Download outside the
      # checkout so a stray file never affects the working tree.
      - name: install yq (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 yq "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The private-backup round-trip test needs age + age-keygen. Pin and
      # checksum-verify like every other downloaded tool.
      - name: install age (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz age/age age/age-keygen
          mkdir -p "$HOME/.local/bin"
          install -m 0755 age/age "$HOME/.local/bin/age"
          install -m 0755 age/age-keygen "$HOME/.local/bin/age-keygen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: bash syntax check
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      # The managed zsh layer had no syntax gate at all — the #96 compinit
      # glob bug lived exactly here (#150). ubuntu-latest (24.04) does not
      # ship zsh, so install it explicitly rather than assume the image.
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh syntax check (managed shell files)
        run: |
          for file in dot_zshenv dot_zshrc dot_zprofile; do
            zsh -n "$file"
          done

      - name: shell syntax gate regression tests
        run: ./scripts/test-shell-syntax.sh

      - name: ai-clip (Ctrl-O) helper tests
        run: ./scripts/test-ai-clip.sh

      - name: zshrc compinit daily cache tests
        run: ./scripts/test-zshrc-compinit.sh

      - name: zshrc PATH and source order tests
        run: ./scripts/test-zshrc-order.sh

      - name: gclone helper tests
        run: ./scripts/test-gclone.sh

      - name: shellcheck (warning and above)
        run: shellcheck -S warning scripts/*.sh

      - name: validate policy
        run: ./scripts/validate-policy.sh --all

      - name: policy fail-closed tests
        run: ./scripts/test-policy.sh

      - name: gitconfig safety tests
        run: ./scripts/test-gitconfig.sh

      - name: npmrc hardening tests
        run: ./scripts/test-npmrc.sh

      - name: doctor tests
        run: ./scripts/test-doctor.sh

      - name: private-backup secrets-gate tests
        run: ./scripts/test-secrets-gate.sh

      - name: private-backup backup/verify tests
        run: ./scripts/test-private-backup.sh

      - name: catalog install gate tests
        run: ./scripts/test-install-packages.sh

      - name: preflight report-only tests
        run: ./scripts/test-preflight.sh

      - name: whitespace check (committed tree)
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  # scripts/*.sh must also run on macOS's /bin/bash 3.2 (the contract in
  # scripts/README.md): a new machine runs preflight before any Homebrew bash,
  # and an agent started with a minimal PATH resolves `#!/usr/bin/env bash` to
  # /bin/bash. The validate job's tests again, on a macOS runner with /bin/bash
  # first on PATH, so the scripts also meet the BSD userland (mktemp, sed,
  # stat) they run on (#333 F06). The render group runs the render job's
  # suites the same way, with chezmoi and codex pinned for macOS: the managed
  # files are applied on macOS, and the Claude settings modify script runs
  # there with /bin/sh, mktemp, trap and jq (#382).
  bash32:
    name: bash32 (${{ matrix.group }})
    runs-on: macos-latest
    # test-doctor alone takes about 40 minutes here (each case is a full
    # doctor run, and process start-up is slow on the macOS runner), so the
    # tests run as parallel groups and the wait is the slowest group's.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: doctor
            suites: test-doctor.sh
          - group: private-backup
            suites: test-secrets-gate.sh test-private-backup.sh
          - group: others
            suites: >-
              test-shell-syntax.sh test-ai-clip.sh test-zshrc-compinit.sh
              test-zshrc-order.sh test-gclone.sh test-policy.sh test-gitconfig.sh
              test-npmrc.sh test-install-packages.sh test-preflight.sh
          # The render job's suites (test-npmrc again: its rendered-content
          # section needs chezmoi, which only this group installs).
          - group: render
            suites: >-
              test-render.sh test-claude-settings.sh test-codex-settings.sh
              test-opencode-settings.sh test-git-signing.sh test-git-ignore.sh
              test-herdr-config.sh test-agent-tools-usage-reader.sh
              test-git-hook-gates.sh test-starship.sh test-ssh.sh test-npmrc.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install yq (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_darwin_arm64"
          echo "${YQ_SHA256_DARWIN_ARM64}  yq" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 yq "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install age (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-darwin-arm64.tar.gz"
          echo "${AGE_SHA256_DARWIN_ARM64}  age.tar.gz" | shasum -a 256 -c -
          tar -xzf age.tar.gz age/age age/age-keygen
          mkdir -p "$HOME/.local/bin"
          install -m 0755 age/age "$HOME/.local/bin/age"
          install -m 0755 age/age-keygen "$HOME/.local/bin/age-keygen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install chezmoi (pinned, checksum verified)
        if: matrix.group == 'render'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o chezmoi.tar.gz "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_darwin_arm64.tar.gz"
          echo "${CHEZMOI_SHA256_DARWIN_ARM64}  chezmoi.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf chezmoi.tar.gz -C "$HOME/.local/bin" chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install codex (pinned, checksum verified)
        if: matrix.group == 'render'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-aarch64-apple-darwin.tar.gz"
          echo "${CODEX_SHA256_DARWIN_ARM64}  codex.tar.gz" | shasum -a 256 -c -
          tar -xzf codex.tar.gz codex-aarch64-apple-darwin
          mkdir -p "$HOME/.local/bin"
          install -m 0755 codex-aarch64-apple-darwin "$HOME/.local/bin/codex"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Added to GITHUB_PATH last, so it comes before every other entry,
      # ~/.local/bin included.
      - name: put /bin/bash (3.2) first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      # Fail here rather than pass on another bash: a runner image change
      # that shadowed the symlink would otherwise go unnoticed.
      - name: env bash is 3.2 on an arm64 runner
        run: |
          version="$(/usr/bin/env bash -c 'printf %s "$BASH_VERSION"')"
          echo "env bash: $version, arch: $(uname -m)"
          case "$version" in 3.2.*) ;; *) echo "expected /bin/bash 3.2 first on PATH" >&2; exit 1 ;; esac
          [ "$(uname -m)" = arm64 ] || { echo "expected an arm64 runner (the pinned tools are arm64)" >&2; exit 1; }

      # bash 3.2's parser: bash 4+ syntax (`|&`, `;;&`, `&>>`) fails here even
      # in a branch no test reaches. Runtime-only features (`declare -A`,
      # `${v,,}`) fail only where the tests below run them.
      - name: bash syntax check (bash 3.2)
        if: matrix.group == 'others'
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: validate policy
        if: matrix.group == 'others'
        run: ./scripts/validate-policy.sh --all

      # Every suite runs even after one fails; the failed ones are named at
      # the end.
      - name: tests (${{ matrix.group }})
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          failed=""
          for suite in $SUITES; do
            echo "::group::$suite"
            ./scripts/"$suite" || failed="$failed $suite"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed" >&2
            exit 1
          fi

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download outside the checkout: a stray file in the source
      # directory would show up as an unexpected managed target.
      - name: install chezmoi (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o chezmoi.tar.gz "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          echo "${CHEZMOI_SHA256}  chezmoi.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf chezmoi.tar.gz -C "$HOME/.local/bin" chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install yq (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 yq "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # test-codex-settings evaluates the rendered Codex rules with Codex's own
      # `codex execpolicy check` (it only evaluates the rules file it is
      # given: no login, no network, no command run), and fails on CI without
      # codex (#332 F36). The release's static Linux binary, not the npm
      # package: pinned and checksum-verified like the tools above.
      - name: install codex (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODEX_SHA256}  codex.tar.gz" | sha256sum -c -
          tar -xzf codex.tar.gz codex-x86_64-unknown-linux-musl
          mkdir -p "$HOME/.local/bin"
          install -m 0755 codex-x86_64-unknown-linux-musl "$HOME/.local/bin/codex"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: chezmoi render and managed-set tests
        run: ./scripts/test-render.sh

      - name: claude settings content tests
        run: ./scripts/test-claude-settings.sh

      - name: codex settings content tests
        run: ./scripts/test-codex-settings.sh

      - name: opencode settings permission floor tests
        run: ./scripts/test-opencode-settings.sh

      - name: git-signing gating tests
        run: ./scripts/test-git-signing.sh

      - name: git-ignore (global gitignore) gating and behaviour tests
        run: ./scripts/test-git-ignore.sh

      - name: herdr config gating and content tests
        run: ./scripts/test-herdr-config.sh

      - name: agent-tools usage reader config gating and content tests
        run: ./scripts/test-agent-tools-usage-reader.sh

      - name: git hook gates wiring tests
        run: ./scripts/test-git-hook-gates.sh

      - name: starship prompt config tests
        run: ./scripts/test-starship.sh

      - name: ssh-1password gating and safety tests
        run: ./scripts/test-ssh.sh

      # Also runs in the validate job for its static checks; here chezmoi is
      # available so the rendered-content section actually executes (#150).
      - name: npmrc rendered-content tests
        run: ./scripts/test-npmrc.sh
