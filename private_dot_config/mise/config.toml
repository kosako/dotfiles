# Managed by chezmoi from kosako/dotfiles.
# Global mise config: baseline runtimes for global tooling only.
#
# Scope split (see docs/runtime.md):
#   - global (this file): the minimal baseline runtimes that global CLIs
#     (npm-global / go-installed tools) need to run outside any project.
#     Declared as lts / major lines, NOT reproducibility pins.
#   - project (.mise.toml): pins exact versions and overrides the baseline.
#
# uv is a Python tool manager (a tool), not Python runtime management;
# Python runtime pinning is a separate scope and is not declared here.

[settings]
# No automatic installs at all (#626). Installs happen only via an
# explicit `mise install`. mise has one switch per entry point and each
# defaults to true, so all four are off:
#   auto_install            any command that needs a missing tool
#   exec_auto_install       `mise exec` / `mise x`
#   task.run_auto_install   `mise run`, before a task runs
#   not_found_auto_install  the shell's command-not-found handler
# To use a version that is not installed, even once (e.g.
# `mise exec node@20 -- node -v`), run `mise install node@20` first.
# mise does not fetch it for you.
auto_install = false
exec_auto_install = false
task.run_auto_install = false
not_found_auto_install = false
# Leave GOBIN unset so `go install` uses Go's own default,
# ${GOPATH:-$HOME/go}/bin (= ~/go/bin), not the toolchain's install dir
# (mise's default when this is unset). The software catalog's go_install
# tools (install-packages.sh) and the managed paths that run them -- the
# Claude statusLine and the agent-tools usage reader, both ~/go/bin/tacho --
# then agree, and a toolchain upgrade does not strand them (#305). ~/.zshenv
# puts ~/go/bin on PATH.
go.set_gobin = false

[tools]
# Baseline runtimes for global tooling. Projects override with exact
# versions in their own .mise.toml.
node = "lts"
go = "1.26"
# uv: Python tool manager (tool), provided so global `uv` works.
uv = "latest"
