# Managed by chezmoi from kosako/dotfiles (otel-backend module, #514).
# The local OpenTelemetry backend: grafana/otel-lgtm (OpenTelemetry
# Collector, Prometheus, Tempo, Loki, Pyroscope and Grafana in one image)
# for the telemetry of the AI agents on this machine. Apply starts nothing:
# a person runs `docker-compose -f ~/.config/otel-lgtm/compose.yaml up -d`
# once, and `restart: unless-stopped` brings the container back with the
# docker daemon. Every port is published on 127.0.0.1 only: Grafana answers
# its API without a login, and Colima forwards a port published without an
# address to every interface of the host. The image is pinned by version
# AND digest; change both in one PR. Prometheus converts delta metrics to
# cumulative on OTLP ingestion: Codex sends every metric as delta, which
# Prometheus otherwise rejects (#517). Each backend keeps data for what it
# is used for (#520, #528): Loki, which the dashboards read, one year by the
# compactor's retention (off in the image); Prometheus and Tempo 30 days,
# Prometheus by its retention flag and Tempo by the block retention of both
# the backend scheduler and the backend worker (the image's defaults are 15
# and 14 days). The dashboards read neither for long ranges, and the archive
# below keeps the raw telemetry for a year. Pyroscope does not push its own
# profiles, the only ones it received (#528).
# Loki also answers one query over up to 366d1h (#532): the dashboards read
# Loki, and its default limit of 30d1h refused a dashboard range of a year.
# Tempo's search keeps its default of 7 days, enough for the panel of
# recent traces.
# The Collector gets the archive config and, for its zstd files, the
# exporter.file.nativeCompression feature gate (#527) in OTELCOL_EXTRA_ARGS.
# Compose passes the environment only when it creates the container, and a
# container without the gate that reads a zstd archive config writes a
# framing `zstd -d` cannot read, which recreating does not repair. So an
# apply that changes the archive config goes: `stop`, apply, then
# `up -d --force-recreate` (a stopped container does not come back with the
# daemon, and a change of the bound file alone is no change of this
# definition to `up -d`). doctor compares the environment and reads the
# first bytes of each zstd file. See docs/otel-backend.md. The binds need the Colima VM to mount exactly two host directories:
# ~/.config/otel-lgtm read-only (the Collector archive config and the
# Grafana dashboards next to this file) and ~/.local/share/otel-lgtm/archive
# writable (the raw telemetry, kept for re-ingesting into another backend).
# create_host_path is false on every bind, so a directory the VM does not
# mount fails the start instead of being created inside the VM, where the
# archive would silently not reach the host. See docs/otel-backend.md.
name: otel-lgtm
services:
  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    container_name: otel-lgtm
    restart: unless-stopped
    environment:
      PROMETHEUS_EXTRA_ARGS: --enable-feature=otlp-deltatocumulative --storage.tsdb.retention.time=30d
      LOKI_EXTRA_ARGS: -store.retention=365d -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.max-query-length=366d1h
      TEMPO_EXTRA_ARGS: -backend-scheduler.provider.work.compaction.block-retention=720h -backend-worker.compaction.block-retention=720h
      PYROSCOPE_EXTRA_ARGS: -self-profiling.disable-push=true
      OTELCOL_EXTRA_ARGS: --feature-gates=exporter.file.nativeCompression --config=file:/otel-lgtm/otelcol-archive.yaml
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - data:/data
      - type: bind
        source: ./otelcol/archive.yaml
        target: /otel-lgtm/otelcol-archive.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/provisioning/agents.yaml
        target: /otel-lgtm/grafana/conf/provisioning/dashboards/agents.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/dashboards
        target: /otel-lgtm/agent-dashboards
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.local/share/otel-lgtm/archive
        target: /archive
        bind:
          create_host_path: false
volumes:
  data:
