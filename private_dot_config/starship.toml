# Managed by chezmoi from kosako/dotfiles (#96). starship prompt config.
# Two-line: information on the first line, the input prompt on the second, so a
# rich first line never crowds what you type. Language/runtime modules appear
# only in relevant projects (starship's contextual default) and reflect the
# mise-selected version on PATH. Symbols use starship defaults to avoid
# requiring a Nerd Font. The git-identity context segment is added separately
# (#96 PR3) so its identity-value-free, public-safe mapping gets isolated review.

add_newline = true

format = """
$directory\
$git_branch$git_status$git_state\
${custom.git_ctx_personal}${custom.git_ctx_other}${custom.git_ctx_none}\
$nodejs$python$golang$rust\
$cmd_duration$status
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[cmd_duration]
# Only show how long a command took when it was slow enough to matter.
min_time = 2000

[status]
# Surface a non-zero exit code by default (off in stock starship).
disabled = false

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

# Git identity context (#96): surface which identity will author commits, so a
# wrong-context commit is caught before it happens. Public-safe: NO identity
# values live here. Each `when` reads the resolved committer name / email and the LOCAL
# ~/.config/git/personal.gitconfig (not managed) at runtime to classify the
# context — personal -> green; any other resolved identity -> yellow (shows the
# email); inside a repo with no identity -> red. "Resolved" needs BOTH a name
# and an email: an email-only context is refused ("empty ident name") and a
# name-only one commits with an empty email (a broken identity), so both are
# red (#383). The identity is the one Git will actually record, from
# `git var GIT_COMMITTER_IDENT` ("Name <email> time zone"), so a committer set
# by GIT_COMMITTER_NAME / GIT_COMMITTER_EMAIL (from a shell or a .envrc) wins
# over user.name / user.email here as it does in Git (#399); Git failing to
# form it (useConfigOnly with no name or email) reads as no identity.
# See docs/git-identity.md.
[custom.git_ctx_personal]
description = "git identity resolves to personal"
when = '''
  git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
  id=$(git var GIT_COMMITTER_IDENT 2>/dev/null) || exit 1
  case $id in *' <'*'>'*) ;; *) exit 1 ;; esac
  n=${id%% <*}
  e=${id#* <}
  e=${e%%>*}
  [ -n "$n" ] && [ -n "$e" ] && [ "$e" = "$(git config --file "$HOME/.config/git/personal.gitconfig" user.email 2>/dev/null)" ]
'''
command = "echo personal"
format = "[$output]($style) "
style = "bold green"

[custom.git_ctx_other]
description = "git identity (name and email) is set but not personal"
when = '''
  git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
  id=$(git var GIT_COMMITTER_IDENT 2>/dev/null) || exit 1
  case $id in *' <'*'>'*) ;; *) exit 1 ;; esac
  n=${id%% <*}
  e=${id#* <}
  e=${e%%>*}
  [ -n "$n" ] && [ -n "$e" ] && [ "$e" != "$(git config --file "$HOME/.config/git/personal.gitconfig" user.email 2>/dev/null)" ]
'''
command = '''
  id=$(git var GIT_COMMITTER_IDENT 2>/dev/null) || exit 1
  e=${id#* <}
  printf '%s\n' "${e%%>*}"
'''
format = "[$output]($style) "
style = "bold yellow"

[custom.git_ctx_none]
description = "inside a repo but no git identity resolved: name or email empty (fail-closed)"
when = '''
  git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
  id=$(git var GIT_COMMITTER_IDENT 2>/dev/null) || exit 0
  case $id in *' <'*'>'*) ;; *) exit 0 ;; esac
  n=${id%% <*}
  e=${id#* <}
  e=${e%%>*}
  [ -z "$n" ] || [ -z "$e" ]
'''
command = "echo '⚠ no-identity'"
format = "[$output]($style) "
style = "bold red"
